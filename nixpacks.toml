[phases.setup]
nixPkgs = [
  "nodejs_20",
  "nodePackages_latest.pnpm",
  "python312",
  "python312Packages.httpx",
  "python312Packages.h2",
  "python312Packages.requests",
  "python312Packages.pyfiglet"
]

[phases.install]
cmds = [
  "pnpm install --frozen-lockfile"
]

[phases.build]
cmds = [
  "pnpm --filter @workspace/api-zod run build",
  "pnpm --filter @workspace/api-server run build",
  "pnpm --filter @workspace/weyn-tools run build",
  "mkdir -p artifacts/api-server/dist/public && cp -r artifacts/weyn-tools/dist/. artifacts/api-server/dist/public/"
]

[start]
cmd = "NODE_ENV=production node artifacts/api-server/dist/index.js"
