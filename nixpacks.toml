[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "npm install -g pnpm",
  "pnpm install --frozen-lockfile"
]

[phases.build]
cmds = [
  "pnpm --filter @workspace/api-zod run build",
  "pnpm --filter @workspace/api-server run build",
  "pnpm --filter @workspace/weyn-tools run build",
  "mkdir -p artifacts/api-server/dist/public && cp -r artifacts/weyn-tools/dist/. artifacts/api-server/dist/public/"
]

[start]
cmd = "node artifacts/api-server/dist/index.js"
