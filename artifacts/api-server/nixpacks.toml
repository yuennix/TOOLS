[phases.setup]
nixPkgs = ["python312", "uv"]

[phases.install]
cmds = [
  "npm install -g pnpm",
  "cd ../../ && pnpm install --frozen-lockfile",
  "uv pip install --system 'httpx[http2]' requests pyfiglet"
]

[phases.build]
cmds = ["cd ../../ && pnpm run build"]

[start]
cmd = "cd ../../ && NODE_ENV=production node artifacts/api-server/dist/index.js"
